<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17131c"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>FK Music</title></head><body>
<div class="app"><header><div><small>FK MUSIC</small><h1 id="title">Home</h1></div><button id="mode">☼</button></header>
<main>
<section id="home" class="page"><div class="now"><div class="cover">♪</div><div><small>NOW PLAYING</small><h2 id="homeTitle">No song selected</h2><p id="homeArtist">Add your music to begin</p></div></div><div class="cards"><button data-page="music">🎵<b>Music</b></button><button data-page="fav">♥<b>Favorites</b></button><button data-page="playlist">☷<b>Playlist</b></button><button data-page="me">⚙<b>Settings</b></button></div><div class="head"><h2>Recently Added</h2><button id="add2">＋ Add Music</button></div><div id="recent"></div></section>
<section id="music" class="page hide"><div class="head"><h2>Music</h2><label>＋ Add Music<input id="files" type="file" accept="audio/*,video/mp4,.mp3,.mp4,.m4a,.wav,.ogg" multiple></label></div><input id="search" placeholder="Search music..."><div id="list"></div><p id="empty">No music added yet.</p></section>
<section id="fav" class="page hide"><div class="head"><h2>Favorites</h2></div><div id="favorites"></div><p id="favEmpty">No favorite songs yet.</p></section>
<section id="playlist" class="page hide"><div class="head"><h2>Playlists</h2><button id="new">＋ New Playlist</button></div><div class="panel">Create and organize your playlists here.</div></section>
<section id="me" class="page hide"><div class="panel"><h2>Settings</h2><button id="lang">🌍 Language <span>English ›</span></button><button id="themes">🎨 Theme Gallery <span>›</span></button><button id="bg">🖼️ Gallery Background <span>›</span></button><button id="light">🌙 Dark / Light <span>›</span></button><input id="bgFile" type="file" accept="image/*"></div></section>
</main>
<nav><button class="active" data-page="home">⌂<small>Home</small></button><button data-page="music">♫<small>Music</small></button><button data-page="fav">♥<small>Favorites</small></button><button data-page="playlist">☷<small>Playlist</small></button><button data-page="me">☻<small>Me</small></button></nav>
<div id="mini" class="mini hide"><span id="miniCover">♪</span><div><b id="miniTitle"></b><small id="miniArtist"></small></div><button id="miniPlay">▶</button></div>
<div id="player" class="modal hide"><div class="player"><button id="close">⌄</button><div class="bigcover">♪</div><small>NOW PLAYING</small><h2 id="ptitle">No song</h2><p id="partist">Artist</p><input id="seek" type="range" min="0" max="100" value="0"><div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div><div class="controls"><button id="back">↶10</button><button id="prev">◀</button><button id="play">▶</button><button id="next">▶</button><button id="forward">10↷</button></div><div class="tools"><button id="pfav">♡</button><button id="shuffle">🔀</button><button id="repeat">🔁</button><button id="speed">1x</button></div><audio id="audio"></audio></div></div></div>
<script src="app.js"></script></body></html>
